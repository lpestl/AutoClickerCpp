; ============================================
;  Настройки автокликера
; ============================================
; mode = fixed   -> фиксированный интервал между кликами (interval)
; mode = random  -> случайный интервал между min и max
mode = random

; Фиксированный интервал между кликами, мс (для mode = fixed)
interval = 100

; Диапазон случайного интервала, мс (для mode = random)
min = 30
max = 60

; Задержка между нажатием (MOUSE_DOWN) и отпусканием (MOUSE_UP), мс.
; Случайное значение в диапазоне [down_delay_min, down_delay_max].
; 0 = без задержки (события идут вплотную)
down_delay_min = 20
down_delay_max = 30
