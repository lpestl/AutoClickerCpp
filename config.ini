; ============================================
;  Настройки автокликера (AutoClickerCpp)
; ============================================
; mode = fixed      -> фиксированный интервал (fixed_interval), клик в текущей позиции курсора
; mode = random     -> случайный интервал между interval_min и interval_max
; mode = precision  -> клик в случайной точке внутри заданного прямоугольника
mode = random

; Фиксированный интервал между кликами, мс (для mode = fixed и mode = precision)
fixed_interval = 100

; Диапазон случайного интервала, мс (для mode = random)
interval_min = 30
interval_max = 60

; Задержка между нажатием (MOUSE_DOWN) и отпусканием (MOUSE_UP), мс.
; Случайное значение в диапазоне [down_delay_min, down_delay_max].
; 0 = без задержки (события идут вплотную)
down_delay_min = 20
down_delay_max = 30

; Прямоугольная область кликов для mode = precision (экранные координаты)
precision_min_x = 2560
precision_max_x = 2630

precision_min_y = 745
precision_max_y = 760

; Показывать окно приложения (true/false).
; Если false — окно скрыто, автокликер работает в фоне (вкл/выкл клавишей Space).
show_debug_window = true
